<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .animate-fade { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm border-b mb-6">
        <div class="max-w-5xl mx-auto px-4 flex justify-around">
            <button onclick="openTab('vendas')" class="py-4 px-2 border-b-2 border-blue-600 text-blue-600 font-bold">Vendas</button>
            <button onclick="openTab('balanco')" class="py-4 px-2 text-gray-500 font-medium">Balanço</button>
            <button onclick="openTab('produtos')" class="py-4 px-2 text-gray-500 font-medium">Produtos</button>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 pb-20">
        
        <div id="vendas" class="tab-content active animate-fade">
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Resumo do Pedido</h2>
                <div class="flex justify-between items-center py-2 border-b border-gray-50">
                    <span class="text-gray-500">Itens Selecionados</span>
                    <span class="text-xl font-bold text-gray-900" id="total-carrinho">R$ 150,00</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Finalizar Venda</h2>
                
                <div class="flex gap-3 mb-6">
                    <div class="flex-1 bg-gray-50 p-3 rounded-xl border border-gray-100 text-center">
                        <p class="text-[10px] uppercase text-gray-400 font-bold">Total</p>
                        <p class="text-lg font-bold text-gray-800" id="valor-total-venda">R$ 150,00</p>
                    </div>
                    <div class="flex-1 bg-red-50 p-3 rounded-xl border border-red-100 text-center" id="box-restante">
                        <p class="text-[10px] uppercase text-red-400 font-bold">Faltando</p>
                        <p class="text-lg font-bold text-red-600" id="valor-restante">R$ 150,00</p>
                    </div>
                </div>

                <div id="lista-pagamentos" class="space-y-3 mb-4">
                    </div>

                <div class="relative mb-6">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Forma de Pagamento:</label>
                    <select id="menu-pagamento" 
                            onchange="adicionarMetodo(this.value)"
                            class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-blue-500 outline-none font-medium text-gray-700 cursor-pointer">
                        <option value="" disabled selected>Clique para selecionar...</option>
                        <option value="Dinheiro">💵 Dinheiro</option>
                        <option value="Pix">📱 Pix</option>
                        <option value="Cartão de Débito">💳 Débito</option>
                        <option value="Cartão de Crédito">💳 Crédito</option>
                    </select>
                </div>

                <button id="btn-finalizar" 
                        disabled
                        class="w-full py-4 bg-blue-200 text-white font-bold rounded-2xl shadow-sm transition-all uppercase tracking-widest cursor-not-allowed">
                    Confirmar e Emitir
                </button>
                <div id="troco-info" class="hidden text-center mt-3 text-green-600 font-bold"></div>
            </div>
        </div>

        <div id="balanco" class="tab-content animate-fade">
            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <h2 class="font-bold text-gray-800">Balanço do Dia</h2>
                <p class="text-gray-500 text-sm">Resumo das vendas realizadas hoje.</p>
            </div>
        </div>

        <div id="produtos" class="tab-content animate-fade">
            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <h2 class="font-bold text-gray-800">Gerenciar Produtos</h2>
                <p class="text-gray-500 text-sm">Adicione ou remova itens do estoque.</p>
            </div>
        </div>

    </main>

    <script>
        let totalVenda = 150.00;
        let pagamentos = [];

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            
            // Estilo dos botões da nav
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600');
                btn.classList.add('text-gray-500');
            });
            event.currentTarget.classList.add('border-b-2', 'border-blue-600', 'text-blue-600');
        }

        function adicionarMetodo(metodo) {
            if (!metodo) return;

            const id = Date.now();
            const container = document.getElementById('lista-pagamentos');

            // Cria o item com o design original de cards
            const row = document.createElement('div');
            row.id = `item-${id}`;
            row.className = "flex items-center gap-3 p-3 bg-white border border-gray-100 rounded-xl shadow-sm animate-fade";
            row.innerHTML = `
                <div class="flex-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">${metodo}</p>
                    <div class="flex items-center gap-2">
                        <span class="text-gray-400 font-bold">R$</span>
                        <input type="number" step="0.01" placeholder="0,00"
                               class="w-full font-bold text-gray-800 focus:outline-none"
                               oninput="atualizarValor(${id}, this.value)">
                    </div>
                </div>
                <button onclick="removerMetodo(${id})" class="text-gray-300 hover:text-red-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `;

            container.appendChild(row);
            pagamentos.push({ id, metodo, valor: 0 });
            document.getElementById('menu-pagamento').value = ""; // Reseta o menu
            atualizarTela();
        }

        function atualizarValor(id, val) {
            const p = pagamentos.find(item => item.id === id);
            if (p) p.valor = parseFloat(val) || 0;
            atualizarTela();
        }

        function removerMetodo(id) {
            pagamentos = pagamentos.filter(p => p.id !== id);
            document.getElementById(`item-${id}`).remove();
            atualizarTela();
        }

        function atualizarTela() {
            const totalPago = pagamentos.reduce((acc, curr) => acc + curr.value, 0);
            const restante = totalVenda - totalPago;
            const btn = document.getElementById('btn-finalizar');
            const displayRestante = document.getElementById('valor-restante');
            const boxRestante = document.getElementById('box-restante');
            const trocoInfo = document.getElementById('troco-info');

            displayRestante.innerText = `R$ ${Math.max(0, restante).toFixed(2).replace('.', ',')}`;

            if (restante <= 0) {
                // Pago!
                boxRestante.classList.replace('bg-red-50', 'bg-green-50');
                boxRestante.classList.replace('border-red-100', 'border-green-100');
                displayRestante.classList.replace('text-red-600', 'text-green-600');
                
                btn.disabled = false;
                btn.classList.replace('bg-blue-200', 'bg-blue-600');
                btn.classList.replace('cursor-not-allowed', 'cursor-pointer');
                
                if(restante < 0) {
                    trocoInfo.innerText = `Troco: R$ ${Math.abs(restante).toFixed(2).replace('.', ',')}`;
                    trocoInfo.classList.remove('hidden');
                } else {
                    trocoInfo.classList.add('hidden');
                }
            } else {
                // Ainda falta
                boxRestante.classList.replace('bg-green-50', 'bg-red-50');
                boxRestante.classList.replace('border-green-100', 'border-red-100');
                displayRestante.classList.replace('text-green-600', 'text-red-600');
                
                btn.disabled = true;
                btn.classList.replace('bg-blue-600', 'bg-blue-200');
                btn.classList.replace('cursor-pointer', 'cursor-not-allowed');
                trocoInfo.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
