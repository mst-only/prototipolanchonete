<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV PRO | Demonstração</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-btn { color: #22c55e; border-bottom: 2px solid #22c55e; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="font-bold text-xl tracking-tighter">PDV <span class="text-green-500">PRO</span></h1>
        <div class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 uppercase tracking-widest text-gray-400">Versão Demo</div>
    </header>

    <nav class="bg-slate-900 border-b border-slate-800 flex justify-around">
        <button onclick="mudarAba('vendas', this)" class="aba-btn active-btn py-3 text-xs font-bold uppercase w-full">Vendas</button>
        <button onclick="mudarAba('estoque', this)" class="aba-btn py-3 text-xs font-bold uppercase w-full text-gray-500">Estoque</button>
        <button onclick="mudarAba('caixa', this)" class="aba-btn py-3 text-xs font-bold uppercase w-full text-gray-500">Caixa</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 pb-40">
        
        <div id="vendas" class="tab-content active">
            <div class="grid grid-cols-2 gap-3">
                <div onclick="adicionar('Burger Pro', 25.00)" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 active:scale-95 transition">
                    <h3 class="font-bold text-sm">Burger Pro</h3>
                    <p class="text-green-500 font-bold">R$ 25,00</p>
                </div>
                <div onclick="adicionar('Batata M', 12.00)" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 active:scale-95 transition">
                    <h3 class="font-bold text-sm">Batata M</h3>
                    <p class="text-green-500 font-bold">R$ 12,00</p>
                </div>
                <div onclick="adicionar('Refrigerante', 7.00)" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 active:scale-95 transition">
                    <h3 class="font-bold text-sm">Refrigerante</h3>
                    <p class="text-green-500 font-bold">R$ 7,00</p>
                </div>
            </div>
        </div>

        <div id="estoque" class="tab-content">
            <h2 class="font-bold mb-4 text-gray-400">Controle de Itens</h2>
            <div class="space-y-2">
                <div class="bg-slate-800 p-3 rounded-xl flex justify-between italic"><span>Burger Pro</span> <span class="text-green-500">12 unid.</span></div>
                <div class="bg-slate-800 p-3 rounded-xl flex justify-between italic"><span>Batata M</span> <span class="text-green-500">25 unid.</span></div>
            </div>
        </div>

        <div id="caixa" class="tab-content">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <p class="text-gray-500 text-sm mb-1">Total em Vendas Hoje</p>
                <h3 id="faturamento" class="text-3xl font-bold text-green-500">R$ 0,00</h3>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 shadow-2xl">
        <div class="flex justify-between items-center mb-4 px-2">
            <span class="text-gray-400 text-sm">Total do Pedido:</span>
            <span id="total-carrinho" class="text-2xl font-bold text-white">R$ 0,00</span>
        </div>
        <button onclick="finalizar()" class="w-full bg-green-500 text-black font-black py-4 rounded-2xl shadow-lg shadow-green-900/20 active:bg-green-600">
            FINALIZAR VENDA
        </button>
    </footer>

    <script>
        let total = 0;
        let faturado = 0;

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.aba-btn').forEach(b => {
                b.classList.remove('active-btn');
                b.classList.add('text-gray-500');
            });
            document.getElementById(id).classList.add('active');
            btn.classList.add('active-btn');
            btn.classList.remove('text-gray-500');
        }

        function adicionar(nome, preco) {
            total += preco;
            document.getElementById('total-carrinho').innerText = `R$ ${total.toFixed(2)}`;
        }

        function finalizar() {
            if (total === 0) return alert("Adicione produtos primeiro!");
            
            const confirmar = confirm(`Total: R$ ${total.toFixed(2)}\nConfirmar pagamento?`);
            if (confirmar) {
                faturado += total;
                document.getElementById('faturamento').innerText = `R$ ${faturado.toFixed(2)}`;
                total = 0;
                document.getElementById('total-carrinho').innerText = `R$ 0,00`;
                alert("Venda realizada com sucesso! ✅");
                mudarAba('caixa', document.querySelectorAll('.aba-btn')[2]);
            }
        }
    </script>
</body>
    </html>
