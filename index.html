<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDV PRO | Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: white; --border: rgba(255, 255, 255, 0.1); }
        .light-mode { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; --border: rgba(0, 0, 0, 0.1); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; padding-top: env(safe-area-inset-top); }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .tab-content { display: none; }
        .tab-content.active { display: block !important; }
        .active-btn { color: #22c55e; border-bottom: 3px solid #22c55e; }
        .input-pay { background: #020617; border: 2px solid #22c55e; border-radius: 15px; padding: 15px; outline: none; width: 100%; text-align: center; font-size: 1.5rem; font-weight: 900; color: #22c55e; }
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="py-4 border-b border-gray-800 flex justify-between items-center px-6 glass relative z-50">
        <div class="w-10"></div>
        <div class="text-center">
            <h1 class="text-3xl font-black italic tracking-tighter flex items-center justify-center gap-2">
                <i class="fas fa-leaf text-green-500"></i> PDV <span class="text-green-500">PRO</span>
            </h1>
            <p class="text-[8px] text-gray-500 font-bold uppercase tracking-[0.4em]">Inteligência em Vendas</p>
        </div>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full glass flex items-center justify-center shadow-lg">
            <i id="theme-icon" class="fas fa-moon text-yellow-400"></i>
        </button>
    </header>

    <nav class="border-b border-gray-800 flex px-2 bg-black/20">
        <button onclick="mudarAba('vendas', this)" class="aba-btn active-btn py-4 text-[10px] font-black uppercase flex-1">Vendas</button>
        <button onclick="mudarAba('estoque', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Estoque</button>
        <button onclick="mudarAba('balanco', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Balanço</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-5 pb-44">
        <div id="vendas" class="tab-content active"><div id="vendas-container" class="space-y-8"></div></div>
        
        <div id="estoque" class="tab-content">
            <div class="glass p-5 rounded-3xl mb-6 max-w-4xl mx-auto">
                <h3 class="text-[10px] font-black uppercase text-green-500 mb-4 tracking-widest">Gestão de Itens</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex gap-2">
                        <input type="text" id="nova-cat" onkeypress="handleEnter(event, addCat)" class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex-1 text-xs outline-none" placeholder="Nova Categoria (Enter)">
                        <button onclick="addCat()" class="bg-green-500 text-black px-4 rounded-xl font-bold">+</button>
                    </div>
                    <button onclick="abrirModalProduto()" class="bg-slate-800 border border-slate-700 text-white p-2 rounded-xl text-xs font-bold hover:bg-slate-700 transition uppercase tracking-widest">
                        + Cadastrar Produto
                    </button>
                </div>
                <div id="categorias-lista" class="flex flex-wrap gap-2 mt-4"></div>
            </div>
            <div id="estoque-lista" class="space-y-3"></div>
        </div>

        <div id="balanco" class="tab-content">
            <div class="glass p-8 rounded-[2.5rem] border-b-4 border-green-500 text-center mb-6 max-w-4xl mx-auto">
                <h3 id="bal-bruto" class="text-4xl font-black italic text-green-500">R$ 0,00</h3>
                <p class="text-gray-500 text-[10px] uppercase font-bold mt-2">Faturamento Total</p>
            </div>
            <div id="caixas-detalhados" class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-4xl mx-auto"></div>
        </div>
    </main>

    <div id="modal-produto" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-[2rem]">
            <h3 class="text-xs font-black mb-4 uppercase text-gray-400 italic text-center">Novo Item</h3>
            <div class="space-y-4">
                <input type="text" id="p-nome" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm" placeholder="Nome">
                <input type="number" id="p-preco" onkeypress="handleEnter(event, salvarProduto)" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm" placeholder="Preço R$">
                <select id="p-cat" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm text-gray-400"></select>
                <button onclick="salvarProduto()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl uppercase text-xs">Salvar (Enter)</button>
                <button onclick="fecharModalProduto()" class="w-full text-gray-500 text-[10px] font-bold uppercase">Cancelar</button>
            </div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-6 rounded-t-[2.5rem] z-50">
        <div class="flex justify-between items-center max-w-6xl mx-auto w-full">
            <div><p class="text-[8px] uppercase text-gray-500 font-black tracking-widest text-green-500">PDV PRO</p><h2 id="total-display" class="text-3xl font-black italic text-white">R$ 0,00</h2></div>
            <button onclick="abrirPagamento()" class="bg-green-500 text-black font-black px-12 py-5 rounded-2xl shadow-xl text-xs uppercase tracking-widest active:scale-95">Pagar</button>
        </div>
    </footer>

    <div id="modal-pag" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black mb-6 flex justify-between uppercase italic text-gray-500">PAGAMENTO <button onclick="fecharModalPag()">&times;</button></h3>
            <div class="bg-gray-900 p-6 rounded-3xl mb-4 text-center border border-slate-800">
                <span class="text-4xl font-black text-[#22c55e]" id="pag-total-devido">R$ 0,00</span>
                <div id="tags-pago" class="mt-2 flex flex-wrap justify-center gap-1 text-white text-[9px]"></div>
                <div class="mt-4 flex justify-between text-[10px] font-bold uppercase pt-3 border-t border-slate-800">
                    <span class="text-red-500">Falta: <span id="pag-faltando">R$ 0,00</span></span>
                    <span id="box-troco" class="text-blue-400 hidden">Troco: <span id="pag-troco">R$ 0,00</span></span>
                </div>
            </div>
            
            <div id="menu-metodos" class="grid grid-cols-2 gap-3">
                <button onclick="setMetodo('Dinheiro')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-money-bill-wave text-green-500"></i><span class="text-[10px] font-bold">DINHEIRO</span></button>
                <button onclick="setMetodo('Pix')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-bolt text-teal-400"></i><span class="text-[10px] font-bold">PIX</span></button>
                <button onclick="setMetodo('Débito')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-credit-card text-blue-400"></i><span class="text-[10px] font-bold">DÉBITO</span></button>
                <button onclick="setMetodo('Crédito')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-credit-card text-purple-400"></i><span class="text-[10px] font-bold">CRÉDITO</span></button>
            </div>

            <div id="area-valor" class="hidden">
                <p id="label-metodo" class="text-[10px] text-center mb-2 uppercase text-gray-500 font-bold"></p>
                <input type="number" id="valor-input" onkeypress="handleEnter(event, confirmarValor)" class="input-pay mb-4" placeholder="0.00">
                <button onclick="confirmarValor()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl uppercase text-xs">Confirmar (Enter)</button>
            </div>

            <button id="btn-concluir" disabled onkeypress="handleEnter(event, concluirVenda)" onclick="concluirVenda()" class="hidden w-full bg-green-500 text-black font-black py-5 rounded-2xl mt-4 uppercase text-xs">Concluir Venda (Enter)</button>
        </div>
    </div>

    <script>
        let categorias = ['Lanches', 'Bebidas'];
        let produtos = [{id:1, n:'Burger Pro', p:25.00, c:'Lanches'}, {id:2, n:'Refrigerante', p:8.00, c:'Bebidas'}];
        let caixa = { Dinheiro: 0, Pix: 0, Débito: 0, Crédito: 0, Total: 0 };
        let totalPedido = 0, pagoAcumulado = 0, pagamentosVenda = [], metodoAtual = "";

        // Helper para o Enter
        function handleEnter(e, func) { if (e.key === 'Enter') func(); }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('light-mode') ? "fas fa-sun text-orange-500" : "fas fa-moon text-yellow-400";
        }

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.aba-btn').forEach(b => { b.classList.remove('active-btn'); b.classList.add('text-gray-500'); });
            document.getElementById(id).classList.add('active');
            btn.classList.add('active-btn'); btn.classList.remove('text-gray-500');
        }

        function renderVendas() {
            document.getElementById('vendas-container').innerHTML = categorias.map(cat => `
                <div><h3 class="text-[10px] font-black uppercase text-green-500 mb-4 tracking-widest flex items-center gap-2"><span class="w-1 h-1 bg-green-500 rounded-full"></span> ${cat}</h3>
                <div class="grid-produtos">${produtos.filter(p => p.c === cat).map(p => `
                <div onclick="add(${p.id})" class="glass p-5 rounded-2xl active:bg-green-500 transition text-left cursor-pointer group">
                <h4 class="font-bold text-sm">${p.n}</h4><p class="text-xs text-gray-400">R$ ${p.p.toFixed(2)}</p></div>`).join('')}</div></div>`).join('');
        }

        function renderEstoque() {
            document.getElementById('estoque-lista').innerHTML = produtos.map(p => `
                <div class="glass p-3 rounded-2xl flex justify-between items-center max-w-4xl mx-auto">
                    <div><h4 class="font-bold text-xs text-green-500">${p.n}</h4><p class="text-[8px] text-gray-500 uppercase font-black">${p.c}</p></div>
                    <button onclick="removerProduto(${p.id})" class="text-red-500 p-2"><i class="fas fa-trash text-xs"></i></button>
                </div>`).join('');
            document.getElementById('categorias-lista').innerHTML = categorias.map((c,i) => `<span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-[9px] font-black uppercase">${c} <i class="fas fa-times ml-1 text-red-500 cursor-pointer" onclick="remCat(${i})"></i></span>`).join('');
            document.getElementById('p-cat').innerHTML = categorias.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function add(id) { totalPedido += produtos.find(x => x.id === id).p; document.getElementById('total-display').innerText = `R$ ${totalPedido.toFixed(2)}`; }

        function abrirPagamento() {
            if(totalPedido === 0) return;
            document.getElementById('pag-total-devido').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('pag-faltando').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('modal-pag').classList.remove('hidden');
            document.getElementById('menu-metodos').classList.remove('hidden');
            document.getElementById('area-valor').classList.add('hidden');
            document.getElementById('btn-concluir').classList.add('hidden');
            document.getElementById('tags-pago').innerHTML = "";
            document.getElementById('box-troco').classList.add('hidden');
            pagoAcumulado = 0; pagamentosVenda = [];
        }

        function setMetodo(m) {
            metodoAtual = m;
            document.getElementById('menu-metodos').classList.add('hidden');
            document.getElementById('area-valor').classList.remove('hidden');
            document.getElementById('label-metodo').innerText = "Valor em " + m;
            const input = document.getElementById('valor-input');
            input.value = (totalPedido - pagoAcumulado).toFixed(2);
            setTimeout(() => { input.focus(); input.select(); }, 50);
        }

        function confirmarValor() {
            const v = parseFloat(document.getElementById('valor-input').value) || 0;
            pagoAcumulado += v;
            pagamentosVenda.push({m: metodoAtual, v: v});
            document.getElementById('tags-pago').innerHTML = pagamentosVenda.map(p => `<span class="bg-green-500/10 text-green-500 px-2 py-1 rounded border border-green-500/20">${p.m}: R$ ${p.v.toFixed(2)}</span>`).join('');
            
            if(pagoAcumulado >= totalPedido) {
                document.getElementById('area-valor').classList.add('hidden');
                document.getElementById('btn-concluir').classList.remove('hidden');
                document.getElementById('btn-concluir').disabled = false;
                setTimeout(() => document.getElementById('btn-concluir').focus(), 50);
                
                const dTotal = pagamentosVenda.filter(p => p.m === 'Dinheiro').reduce((acc, p) => acc + p.v, 0);
                if(pagoAcumulado > totalPedido && dTotal > 0) {
                    document.getElementById('box-troco').classList.remove('hidden');
                    document.getElementById('pag-troco').innerText = `R$ ${(pagoAcumulado - totalPedido).toFixed(2)}`;
                }
            } else {
                document.getElementById('area-valor').classList.add('hidden');
                document.getElementById('menu-metodos').classList.remove('hidden');
            }
            document.getElementById('pag-faltando').innerText = `R$ ${Math.max(0, totalPedido - pagoAcumulado).toFixed(2)}`;
        }

        function concluirVenda() {
            const troco = (pagoAcumulado > totalPedido) ? (pagoAcumulado - totalPedido) : 0;
            pagamentosVenda.forEach(p => { if(p.m === 'Dinheiro') caixa.Dinheiro += (p.v - troco); else caixa[p.m] += p.v; });
            caixa.Total += totalPedido;
            alert("PDV PRO: Sucesso! ✅");
            totalPedido = 0; document.getElementById('total-display').innerText = `R$ 0,00`;
            fecharModalPag(); atualizarBalanco(); renderVendas();
        }

        function atualizarBalanco() {
            document.getElementById('bal-bruto').innerText = `R$ ${caixa.Total.toFixed(2)}`;
            document.getElementById('caixas-detalhados').innerHTML = ['Dinheiro', 'Pix', 'Débito', 'Crédito'].map(m => `
                <div class="glass p-4 rounded-2xl border-l-2 border-slate-800"><p class="text-[8px] uppercase text-gray-500 font-bold">${m}</p><h4 class="font-black text-xs">R$ ${caixa[m].toFixed(2)}</h4></div>
            `).join('');
        }

        function abrirModalProduto() { document.getElementById('modal-produto').classList.remove('hidden'); document.getElementById('p-nome').focus(); }
        function fecharModalProduto() { document.getElementById('modal-produto').classList.add('hidden'); }
        function salvarProduto() {
            const n = document.getElementById('p-nome').value, p = parseFloat(document.getElementById('p-preco').value), c = document.getElementById('p-cat').value;
            if(n && p) { 
                produtos.push({id: Date.now(), n, p, c}); 
                document.getElementById('p-nome').value = ''; document.getElementById('p-preco').value = '';
                fecharModalProduto(); renderEstoque(); renderVendas(); 
            }
        }
        function removerProduto(id) { produtos = produtos.filter(p => p.id !== id); renderEstoque(); renderVendas(); }
        function remCat(i) { categorias.splice(i,1); renderEstoque(); renderVendas(); }
        function addCat() { const n = document.getElementById('nova-cat').value; if(n) { categorias.push(n); document.getElementById('nova-cat').value=''; renderEstoque(); renderVendas(); } }
        function fecharModalPag() { document.getElementById('modal-pag').classList.add('hidden'); }

        renderVendas(); renderEstoque(); atualizarBalanco();
    </script>
</body>
</html>
