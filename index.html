<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV PRO | Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .sidebar-item:hover { background-color: #1f2937; border-left: 4px solid #10b981; }
        .active-tab { background-color: #1f2937; border-left: 4px solid #10b981; color: white; }
        .card-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-black flex flex-col border-r border-gray-800">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-green-500 flex items-center gap-2">
                <i class="fas fa-leaf"></i> PDV <span class="text-white">PRO</span>
            </h1>
            <p class="text-xs text-gray-500 mt-1">SISTEMA MOLDÁVEL</p>
        </div>

        <nav class="flex-1 mt-4">
            <a href="#" onclick="showTab('vendas')" class="sidebar-item active-tab flex items-center gap-3 p-4 transition-all">
                <i class="fas fa-shopping-cart"></i> Vendas
            </a>
            <a href="#" onclick="showTab('produtos')" class="sidebar-item flex items-center gap-3 p-4 text-gray-400 transition-all">
                <i class="fas fa-box"></i> Produtos
            </a>
            <a href="#" onclick="showTab('clientes')" class="sidebar-item flex items-center gap-3 p-4 text-gray-400 transition-all">
                <i class="fas fa-users"></i> Clientes
            </a>
            <a href="#" onclick="showTab('relatorios')" class="sidebar-item flex items-center gap-3 p-4 text-gray-400 transition-all">
                <i class="fas fa-chart-line"></i> Relatórios
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800">
            <button class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold transition-all">
                DEMO COMPLETA
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="h-16 border-b border-gray-800 flex items-center justify-between px-8 bg-[#121212]">
            <h2 id="tab-title" class="text-xl font-semibold">Vendas</h2>
            <div class="relative w-96">
                <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
                <input type="text" placeholder="Buscar produto ou cliente..." class="w-full bg-gray-900 border border-gray-700 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-green-500">
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            
            <section id="vendas-content" class="flex-1 p-6 overflow-y-auto custom-scroll grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div onclick="addToCart('X-Burger Pro', 28.50)" class="card-glass p-4 rounded-2xl hover:scale-105 transition-transform cursor-pointer group">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" class="w-full h-32 object-cover rounded-xl mb-4" alt="Burger">
                    <h3 class="font-bold">X-Burger Pro</h3>
                    <p class="text-green-500 font-bold mt-1 text-lg">R$ 28,50</p>
                </div>
                </section>

            <aside class="w-96 bg-black p-6 border-l border-gray-800 flex flex-col">
                <h3 class="text-lg font-bold mb-4 border-b border-gray-800 pb-2">Carrinho de Pedidos</h3>
                <div id="cart-items" class="flex-1 overflow-y-auto custom-scroll space-y-4 pr-2">
                    <p class="text-gray-600 text-center mt-10">Carrinho vazio</p>
                </div>

                <div class="mt-6 space-y-3 bg-gray-900 p-4 rounded-2xl border border-gray-800">
                    <div class="flex justify-between text-sm text-gray-400">
                        <span>Subtotal:</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="flex justify-between text-xl font-bold text-white border-t border-gray-700 pt-2">
                        <span>TOTAL:</span>
                        <span class="text-green-500" id="total-cart">R$ 145,50</span>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="finalizar()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl">FINALIZAR VENDA</button>
                        <button class="bg-gray-800 p-3 rounded-xl hover:bg-gray-700"><i class="fas fa-print"></i></button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(nome, preco) {
            cart.push({nome, preco});
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-cart');
            const subtotalEl = document.getElementById('subtotal');
            
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-gray-600 text-center mt-10">Carrinho vazio</p>';
                totalEl.innerText = 'R$ 0,00';
                subtotalEl.innerText = 'R$ 0,00';
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-900 p-3 rounded-lg border border-gray-800">
                    <div>
                        <p class="font-medium text-sm text-white">${item.nome}</p>
                        <p class="text-xs text-green-500">R$ ${item.preco.toFixed(2)}</p>
                    </div>
                    <button onclick="removeItem(${idx})" class="text-red-500 text-xs hover:bg-red-900/20 p-2 rounded"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            total = cart.reduce((acc, item) => acc + item.preco, 0);
            totalEl.innerText = `R$ ${total.toFixed(2)}`;
            subtotalEl.innerText = `R$ ${total.toFixed(2)}`;
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            renderCart();
        }

        function showTab(tab) {
            document.getElementById('tab-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            // Lógica simples de navegação para a demo
            if(tab !== 'vendas') {
                document.getElementById('vendas-content').innerHTML = `
                    <div class="col-span-full text-center mt-20">
                        <i class="fas fa-lock text-4xl text-gray-700 mb-4"></i>
                        <p class="text-gray-500 text-lg italic">Esta seção de <b>${tab}</b> está sendo moldada para o seu negócio.</p>
                    </div>`;
            } else {
                location.reload(); // Reseta para a demo de vendas
            }
        }

        function finalizar() {
            if(total === 0) return alert("Adicione produtos primeiro!");
            alert("✅ Venda Processada!\nTotal: R$ " + total.toFixed(2));
            cart = [];
            renderCart();
        }
    </script>
</body>
</html>
