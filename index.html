<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV PRO | Demo Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-btn { color: #22c55e; border-bottom: 3px solid #22c55e; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="modal-pag" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-3xl">
            <h3 class="text-xl font-bold mb-4 flex justify-between">Finalizar Venda <button onclick="fecharModal('modal-pag')">&times;</button></h3>
            <div class="bg-slate-800 p-4 rounded-2xl mb-4 flex justify-between">
                <span>Total a Pagar:</span> <span class="text-xl font-bold text-green-500" id="pag-total-devido">R$ 0,00</span>
            </div>
            <div class="space-y-3">
                <div class="flex gap-2 items-center">
                    <span class="w-20 text-xs font-bold uppercase text-gray-400">Dinheiro</span>
                    <input type="number" id="pay-dinheiro" oninput="calcTroco()" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 outline-none focus:border-green-500" placeholder="0,00">
                </div>
                <div class="flex gap-2 items-center">
                    <span class="w-20 text-xs font-bold uppercase text-gray-400">Cartão</span>
                    <input type="number" id="pay-cartao" oninput="calcTroco()" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 outline-none focus:border-green-500" placeholder="0,00">
                </div>
                <div class="flex gap-2 items-center">
                    <span class="w-20 text-xs font-bold uppercase text-gray-400">Pix</span>
                    <input type="number" id="pay-pix" oninput="calcTroco()" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 outline-none focus:border-green-500" placeholder="0,00">
                </div>
            </div>
            <div class="mt-6 p-4 border-t border-slate-700">
                <div class="flex justify-between mb-4">
                    <span>Faltando:</span> <span id="pag-faltando" class="font-bold text-red-500">R$ 0,00</span>
                </div>
                <button id="btn-concluir" disabled onclick="concluirVenda()" class="w-full bg-gray-700 text-gray-400 font-black py-4 rounded-2xl transition cursor-not-allowed">CONCLUIR VENDA</button>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="font-black text-xl tracking-tighter italic">PDV <span class="text-green-500">PRO</span></h1>
        <button onclick="mudarAba('vendas', this)" class="bg-green-500 text-black text-[10px] font-black px-3 py-1 rounded-full uppercase">Nova Venda</button>
    </header>

    <nav class="bg-slate-900 border-b border-slate-800 flex">
        <button onclick="mudarAba('vendas', this)" class="aba-btn active-btn py-4 text-[10px] font-black uppercase flex-1">Vendas</button>
        <button onclick="mudarAba('estoque', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Estoque</button>
        <button onclick="mudarAba('config', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Categorias</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 pb-48">
        <div id="vendas" class="tab-content active">
            <div id="vendas-container"></div>
        </div>

        <div id="estoque" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold">Produtos</h2>
                <button onclick="alert('Funcionalidade no Sistema Real')" class="bg-slate-800 p-2 rounded-lg text-xs">+ Novo Produto</button>
            </div>
            <div id="estoque-lista" class="space-y-2"></div>
        </div>

        <div id="config" class="tab-content text-center py-10">
            <h2 class="font-bold mb-4">Gerenciar Categorias</h2>
            <div id="categorias-lista" class="flex flex-wrap gap-2 justify-center mb-10"></div>
            <p class="text-[10px] text-gray-500 italic">No sistema real você poderá criar e deletar categorias livremente.</p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-5 rounded-t-3xl">
        <div class="flex justify-between items-end mb-4">
            <div><p class="text-gray-500 text-[10px] uppercase font-bold">Total Pedido</p><h2 id="total-display" class="text-3xl font-black">R$ 0,00</h2></div>
            <button onclick="abrirPagamento()" class="bg-green-500 text-black font-black px-8 py-4 rounded-2xl shadow-xl shadow-green-900/40 active:scale-95 transition">PAGAR</button>
        </div>
    </footer>

    <script>
        let categorias = ['Lanches', 'Bebidas', 'Porções'];
        let produtos = [
            { id: 1, n: 'Burger Pro', p: 25.00, c: 'Lanches', e: 10 },
            { id: 2, n: 'X-Salada', p: 22.00, c: 'Lanches', e: 15 },
            { id: 3, n: 'Coca Lata', p: 7.00, c: 'Bebidas', e: 50 },
            { id: 4, n: 'Batata G', p: 18.00, c: 'Porções', e: 12 }
        ];
        let carrinho = [];
        let totalPedido = 0;

        function renderVendas() {
            const container = document.getElementById('vendas-container');
            container.innerHTML = categorias.map(cat => `
                <div class="mb-6">
                    <h3 class="text-xs font-black uppercase text-green-500 mb-3 tracking-widest">${cat}</h3>
                    <div class="grid grid-cols-2 gap-3">
                        ${produtos.filter(p => p.c === cat).map(p => `
                            <div onclick="add(${p.id})" class="glass p-4 rounded-2xl active:bg-green-500/20 transition">
                                <h4 class="font-bold text-sm">${p.n}</h4>
                                <p class="text-xs text-gray-400">R$ ${p.p.toFixed(2)}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderEstoque() {
            document.getElementById('estoque-lista').innerHTML = produtos.map(p => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div><h4 class="font-bold">${p.n}</h4><p class="text-[10px] text-gray-500">${p.c} | ${p.e} no estoque</p></div>
                    <div class="flex gap-2">
                        <button class="text-blue-400 p-2"><i class="fas fa-edit"></i></button>
                        <button class="text-red-400 p-2" onclick="removerProduto(${p.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderCategorias() {
            document.getElementById('categorias-lista').innerHTML = categorias.map(c => `
                <span class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2">
                    ${c} <i class="fas fa-times text-red-500 cursor-pointer"></i>
                </span>
            `).join('');
        }

        function add(id) {
            const p = produtos.find(x => x.id === id);
            carrinho.push(p);
            totalPedido += p.p;
            document.getElementById('total-display').innerText = `R$ ${totalPedido.toFixed(2)}`;
        }

        function abrirPagamento() {
            if (totalPedido === 0) return alert("Adicione itens!");
            document.getElementById('pag-total-devido').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('pag-faltando').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('modal-pag').classList.remove('hidden');
        }

        function calcTroco() {
            const d = parseFloat(document.getElementById('pay-dinheiro').value) || 0;
            const c = parseFloat(document.getElementById('pay-cartao').value) || 0;
            const p = parseFloat(document.getElementById('pay-pix').value) || 0;
            const pago = d + c + p;
            const falta = totalPedido - pago;
            
            const txtFalta = document.getElementById('pag-faltando');
            const btn = document.getElementById('btn-concluir');

            if(falta <= 0) {
                txtFalta.innerText = "PAGO";
                txtFalta.className = "font-bold text-green-500";
                btn.disabled = false;
                btn.className = "w-full bg-green-500 text-black font-black py-4 rounded-2xl transition cursor-pointer shadow-lg shadow-green-900/40";
            } else {
                txtFalta.innerText = `R$ ${falta.toFixed(2)}`;
                txtFalta.className = "font-bold text-red-500";
                btn.disabled = true;
                btn.className = "w-full bg-gray-700 text-gray-400 font-black py-4 rounded-2xl transition cursor-not-allowed";
            }
        }

        function concluirVenda() {
            alert("Venda Finalizada! O estoque foi atualizado.");
            totalPedido = 0;
            carrinho = [];
            document.getElementById('total-display').innerText = `R$ 0,00`;
            fecharModal('modal-pag');
            mudarAba('vendas', document.querySelectorAll('.aba-btn')[0]);
        }

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.aba-btn').forEach(b => {
                b.classList.remove('active-btn');
                b.classList.add('text-gray-500');
            });
            document.getElementById(id).classList.add('active');
            btn.classList.add('active-btn');
            btn.classList.remove('text-gray-500');
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        // Init
        renderVendas();
        renderEstoque();
        renderCategorias();
    </script>
</body>
            </html>
