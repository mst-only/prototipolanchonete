<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV PRO | Edição Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-btn { color: #22c55e; border-bottom: 3px solid #22c55e; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-dark { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; outline: none; transition: 0.3s; }
        .input-dark:focus { border-color: #22c55e; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="modal-pag" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-[2.5rem]">
            <h3 class="text-xl font-black mb-6 flex justify-between uppercase italic">Pagamento <button onclick="fecharModal('modal-pag')">&times;</button></h3>
            
            <div class="bg-slate-900/50 p-5 rounded-2xl mb-6 border border-slate-800">
                <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Total da Venda</p>
                <span class="text-3xl font-black text-green-500" id="pag-total-devido">R$ 0,00</span>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3 items-center">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-tighter"><i class="fas fa-money-bill-wave mr-2"></i> Dinheiro</label>
                    <input type="number" id="pay-dinheiro" oninput="fluxoPagamento()" class="input-dark text-green-500 font-bold" placeholder="0.00">
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-tighter"><i class="fas fa-credit-card mr-2"></i> Débito</label>
                    <input type="number" id="pay-debito" oninput="fluxoPagamento()" class="input-dark" placeholder="0.00">
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-tighter"><i class="fas fa-credit-card mr-2"></i> Crédito</label>
                    <input type="number" id="pay-credito" oninput="fluxoPagamento()" class="input-dark" placeholder="0.00">
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-tighter"><i class="fas fa-bolt mr-2"></i> Pix</label>
                    <input type="number" id="pay-pix" oninput="fluxoPagamento()" class="input-dark" placeholder="0.00">
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-800 space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">Faltando:</span> <span id="pag-faltando" class="font-bold text-red-500">R$ 0,00</span>
                </div>
                <div id="div-troco" class="flex justify-between text-sm hidden">
                    <span class="text-gray-400">Troco:</span> <span id="pag-troco" class="font-bold text-blue-400">R$ 0,00</span>
                </div>
                <button id="btn-concluir" disabled onclick="concluirVenda()" class="w-full bg-slate-800 text-gray-600 font-black py-4 rounded-2xl mt-4 uppercase tracking-widest transition cursor-not-allowed">Concluir</button>
            </div>
        </div>
    </div>

    <header class="bg-slate-950 p-5 border-b border-slate-900 flex justify-between items-center">
        <div><h1 class="font-black text-2xl italic tracking-tighter">PDV <span class="text-green-500">PRO</span></h1></div>
        <div class="flex gap-4">
            <div class="text-right hidden md:block">
                <p class="text-[8px] uppercase text-gray-500 font-bold">Vendas Hoje</p>
                <p id="head-vendas" class="font-bold text-green-500 text-sm">R$ 0,00</p>
            </div>
        </div>
    </header>

    <nav class="bg-slate-950 border-b border-slate-900 flex px-2">
        <button onclick="mudarAba('vendas', this)" class="aba-btn active-btn py-4 text-[10px] font-black uppercase flex-1">Vendas</button>
        <button onclick="mudarAba('estoque', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Estoque / Categorias</button>
        <button onclick="mudarAba('balanco', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Balanço</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-5 pb-40">
        <div id="vendas" class="tab-content active">
            <div id="vendas-container"></div>
        </div>

        <div id="estoque" class="tab-content">
            <div class="glass p-6 rounded-3xl mb-6">
                <h3 class="text-xs font-black uppercase text-green-500 mb-4 tracking-widest">Categorias</h3>
                <div id="categorias-lista" class="flex flex-wrap gap-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="nova-cat" class="input-dark flex-1 text-sm p-2" placeholder="Nome da Categoria">
                    <button onclick="addCategoria()" class="bg-green-500 text-black px-4 rounded-xl font-bold">+</button>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-black uppercase tracking-widest">Produtos</h3>
                <button onclick="abrirNovoProduto()" class="text-[10px] bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">+ NOVO ITEM</button>
            </div>
            <div id="estoque-lista" class="space-y-3"></div>
        </div>

        <div id="balanco" class="tab-content">
            <h2 class="text-xs font-black uppercase text-green-500 mb-6 tracking-widest text-center">Resumo Financeiro</h2>
            <div class="grid gap-4">
                <div class="glass p-8 rounded-[2rem] text-center border-b-4 border-green-500">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2">Total Bruto</p>
                    <h3 id="bal-bruto" class="text-4xl font-black italic">R$ 0,00</h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass p-5 rounded-3xl text-center">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">Pedidos</p>
                        <h4 id="bal-pedidos" class="text-xl font-black">0</h4>
                    </div>
                    <div class="glass p-5 rounded-3xl text-center">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">Ticket Médio</p>
                        <h4 id="bal-ticket" class="text-xl font-black text-green-500">R$ 0,00</h4>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-6 rounded-t-[2.5rem] z-50">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[8px] uppercase text-gray-500 font-black tracking-widest">Total do Cupom</p>
                <h2 id="total-display" class="text-3xl font-black italic">R$ 0,00</h2>
            </div>
            <button onclick="abrirPagamento()" class="bg-green-500 text-black font-black px-10 py-5 rounded-2xl shadow-2xl shadow-green-900/40 active:scale-95 transition text-xs uppercase tracking-widest">Finalizar</button>
        </div>
    </footer>

    <script>
        let categorias = ['Lanches', 'Bebidas'];
        let produtos = [
            { id: 1, n: 'Burger Pro', p: 25.00, c: 'Lanches', e: 10 },
            { id: 2, n: 'Coca Lata', p: 7.00, c: 'Bebidas', e: 50 }
        ];
        let faturamento = 0;
        let qtdPedidos = 0;
        let totalPedido = 0;

        function renderVendas() {
            const container = document.getElementById('vendas-container');
            container.innerHTML = categorias.map(cat => `
                <div class="mb-8">
                    <h3 class="text-[10px] font-black uppercase text-green-500 mb-4 tracking-[0.2em] flex items-center gap-2">
                        <span class="w-1 h-1 bg-green-500 rounded-full"></span> ${cat}
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        ${produtos.filter(p => p.c === cat).map(p => `
                            <div onclick="add(${p.id})" class="glass p-5 rounded-2xl active:bg-green-500 text-left transition group">
                                <h4 class="font-bold text-sm group-active:text-black">${p.n}</h4>
                                <p class="text-xs text-gray-400 group-active:text-black/70">R$ ${p.p.toFixed(2)}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderEstoque() {
            document.getElementById('estoque-lista').innerHTML = produtos.map(p => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center border-l-4 border-slate-700">
                    <div><h4 class="font-bold text-sm text-green-500">${p.n}</h4><p class="text-[9px] text-gray-500 uppercase font-black">${p.c} | ${p.e} EM ESTOQUE</p></div>
                    <div class="flex gap-2"><button class="text-blue-400 p-2"><i class="fas fa-pen"></i></button><button class="text-red-500 p-2"><i class="fas fa-trash"></i></button></div>
                </div>
            `).join('');
            
            document.getElementById('categorias-lista').innerHTML = categorias.map((c, i) => `
                <span class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-full text-[10px] font-black uppercase flex items-center gap-2">
                    ${c} <i class="fas fa-times text-red-500 cursor-pointer" onclick="removerCat(${i})"></i>
                </span>
            `).join('');
        }

        function addCategoria() {
            const val = document.getElementById('nova-cat').value;
            if(val) { categorias.push(val); document.getElementById('nova-cat').value = ''; renderEstoque(); renderVendas(); }
        }

        function removerCat(i) { categorias.splice(i, 1); renderEstoque(); renderVendas(); }

        function add(id) {
            const p = produtos.find(x => x.id === id);
            totalPedido += p.p;
            document.getElementById('total-display').innerText = `R$ ${totalPedido.toFixed(2)}`;
        }

        function abrirPagamento() {
            if (totalPedido === 0) return alert("Adicione produtos!");
            document.getElementById('pag-total-devido').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('modal-pag').classList.remove('hidden');
            fluxoPagamento();
        }

        function fluxoPagamento() {
            const dinheiro = parseFloat(document.getElementById('pay-dinheiro').value) || 0;
            const debito = parseFloat(document.getElementById('pay-debito').value) || 0;
            const credito = parseFloat(document.getElementById('pay-credito').value) || 0;
            const pix = parseFloat(document.getElementById('pay-pix').value) || 0;
            
            const pago = dinheiro + debito + credito + pix;
            const falta = totalPedido - pago;
            const troco = dinheiro > 0 && pago > totalPedido ? pago - totalPedido : 0;
            
            const txtFalta = document.getElementById('pag-faltando');
            const txtTroco = document.getElementById('pag-troco');
            const divTroco = document.getElementById('div-troco');
            const btn = document.getElementById('btn-concluir');

            if(falta <= 0) {
                txtFalta.innerText = "PAGO";
                txtFalta.className = "font-bold text-green-500";
                btn.disabled = false;
                btn.className = "w-full bg-green-500 text-black font-black py-4 rounded-2xl mt-4 uppercase tracking-widest shadow-xl shadow-green-900/40";
                
                if(troco > 0) {
                    divTroco.classList.remove('hidden');
                    txtTroco.innerText = `R$ ${troco.toFixed(2)}`;
                } else { divTroco.classList.add('hidden'); }
            } else {
                txtFalta.innerText = `R$ ${falta.toFixed(2)}`;
                txtFalta.className = "font-bold text-red-500";
                btn.disabled = true;
                btn.className = "w-full bg-slate-800 text-gray-600 font-black py-4 rounded-2xl mt-4 uppercase tracking-widest";
                divTroco.classList.add('hidden');
            }
        }

        function concluirVenda() {
            faturamento += totalPedido;
            qtdPedidos++;
            
            // Balanço
            document.getElementById('bal-bruto').innerText = `R$ ${faturamento.toFixed(2)}`;
            document.getElementById('head-vendas').innerText = `R$ ${faturamento.toFixed(2)}`;
            document.getElementById('bal-pedidos').innerText = qtdPedidos;
            document.getElementById('bal-ticket').innerText = `R$ ${(faturamento / qtdPedidos).toFixed(2)}`;

            alert("VENDA CONCLUÍDA ✅");
            totalPedido = 0;
            document.getElementById('total-display').innerText = `R$ 0,00`;
            document.querySelectorAll('input').forEach(i => i.value = '');
            fecharModal('modal-pag');
            mudarAba('balanco', document.querySelectorAll('.aba-btn')[2]);
        }

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.aba-btn').forEach(b => { b.classList.remove('active-btn'); b.classList.add('text-gray-500'); });
            document.getElementById(id).classList.add('active');
            btn.classList.add('active-btn');
            btn.classList.remove('text-gray-500');
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        function abrirNovoProduto() { alert("Modal de cadastro (Sistema Real)"); }

        renderVendas(); renderEstoque();
    </script>
</body>
</html>
