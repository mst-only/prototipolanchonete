<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV PRO | Interface Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #1a1d21; color: #f8fafc; overflow-x: hidden; }
        .glass-card { background: rgba(30, 35, 41, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-green { background-color: #31d072; color: #000; font-weight: 800; transition: all 0.3s; }
        .btn-green:hover { background-color: #28a75a; transform: scale(1.02); }
        .nav-item { color: #94a3b8; transition: all 0.3s; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-item.active { color: #31d072; border-bottom: 2px solid #31d072; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="glass-card h-16 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-2">
            <i class="fas fa-leaf text-2xl text-[#31d072]"></i>
            <h1 class="text-xl font-black tracking-tighter">PDV <span class="text-[#31d072]">PRO</span></h1>
        </div>
        
        <div class="hidden md:flex gap-8">
            <div onclick="setTab(this)" class="nav-item active pb-1 text-sm font-bold uppercase"><i class="fas fa-shopping-bag mr-2"></i>Vendas</div>
            <div onclick="setTab(this)" class="nav-item pb-1 text-sm font-bold uppercase"><i class="fas fa-box mr-2"></i>Produtos</div>
            <div onclick="setTab(this)" class="nav-item pb-1 text-sm font-bold uppercase"><i class="fas fa-users mr-2"></i>Clientes</div>
            <div onclick="setTab(this)" class="nav-item pb-1 text-sm font-bold uppercase"><i class="fas fa-chart-pie mr-2"></i>Relatórios</div>
        </div>

        <button class="bg-transparent border border-gray-600 px-4 py-1 rounded-full text-xs font-bold hover:bg-white hover:text-black transition">MODO DEMO</button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <main class="flex-1 p-4 md:p-8 overflow-y-auto custom-scroll">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Vendas <span class="text-gray-500 text-sm font-normal">/ Lanchonete</span></h2>
                <div class="relative">
                    <input type="text" placeholder="Buscar..." class="bg-gray-800 border-none rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-[#31d072] w-40 md:w-64">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-500 text-xs"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <div onclick="add('Burger Classic', 25.90, 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300')" class="glass-card p-3 rounded-2xl cursor-pointer hover:border-[#31d072] transition group">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" class="w-full h-24 object-cover rounded-xl mb-3">
                    <h3 class="text-sm font-bold group-hover:text-[#31d072]">Burger Classic</h3>
                    <p class="text-[#31d072] font-black mt-1">R$ 25,90</p>
                </div>
                <div onclick="add('Pizza Slice', 15.00, 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300')" class="glass-card p-3 rounded-2xl cursor-pointer hover:border-[#31d072] transition group">
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300" class="w-full h-24 object-cover rounded-xl mb-3">
                    <h3 class="text-sm font-bold group-hover:text-[#31d072]">Pizza Slice</h3>
                    <p class="text-[#31d072] font-black mt-1">R$ 15,00</p>
                </div>
                <div onclick="add('Batata Média', 12.00, 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300')" class="glass-card p-3 rounded-2xl cursor-pointer hover:border-[#31d072] transition group">
                    <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300" class="w-full h-24 object-cover rounded-xl mb-3">
                    <h3 class="text-sm font-bold group-hover:text-[#31d072]">Batata Média</h3>
                    <p class="text-[#31d072] font-black mt-1">R$ 12,00</p>
                </div>
                <div onclick="add('Coca-Cola', 7.50, 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300')" class="glass-card p-3 rounded-2xl cursor-pointer hover:border-[#31d072] transition group">
                    <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" class="w-full h-24 object-cover rounded-xl mb-3">
                    <h3 class="text-sm font-bold group-hover:text-[#31d072]">Coca-Cola</h3>
                    <p class="text-[#31d072] font-black mt-1">R$ 7,50</p>
                </div>
            </div>
        </main>

        <aside id="carrinho" class="hidden lg:flex w-96 glass-card border-l border-gray-800 flex-col p-6 fixed lg:relative inset-y-0 right-0 z-40 bg-[#1a1d21] lg:bg-transparent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold">Carrinho de Pedidos</h3>
                <button onclick="toggleMobileCart()" class="lg:hidden text-gray-400"><i class="fas fa-times"></i></button>
            </div>

            <div id="itens-lista" class="flex-1 overflow-y-auto pr-2 space-y-4">
                <div class="text-center text-gray-600 mt-20">
                    <i class="fas fa-shopping-basket text-4xl mb-4"></i>
                    <p>O carrinho está vazio</p>
                </div>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-800">
                <div class="flex justify-between text-gray-400 mb-2">
                    <span>Subtotal</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center mb-6">
                    <span class="text-xl font-bold">TOTAL</span>
                    <span id="total" class="text-3xl font-black text-[#31d072]">R$ 0,00</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="finalizar()" class="btn-green py-4 rounded-2xl shadow-lg shadow-green-900/20">FINALIZAR</button>
                    <button class="bg-gray-800 hover:bg-gray-700 font-bold rounded-2xl">PAGAMENTO</button>
                </div>
            </div>
        </aside>
    </div>

    <div onclick="toggleMobileCart()" class="lg:hidden glass-card p-4 border-t border-gray-800 flex justify-between items-center cursor-pointer">
        <div class="flex items-center gap-3">
            <div class="bg-[#31d072] text-black h-8 w-8 rounded-lg flex items-center justify-center font-bold" id="mobile-count">0</div>
            <span class="font-bold">Ver Carrinho</span>
        </div>
        <span id="mobile-total" class="text-xl font-black text-[#31d072]">R$ 0,00</span>
    </div>

    <script>
        let carrinho = [];
        
        function add(nome, preco, img) {
            carrinho.push({nome, preco, img});
            atualizar();
        }

        function atualizar() {
            const lista = document.getElementById('itens-lista');
            const totalEl = document.getElementById('total');
            const subtotalEl = document.getElementById('subtotal');
            const mTotal = document.getElementById('mobile-total');
            const mCount = document.getElementById('mobile-count');

            if(carrinho.length === 0) {
                lista.innerHTML = '<div class="text-center text-gray-600 mt-20"><i class="fas fa-shopping-basket text-4xl mb-4"></i><p>O carrinho está vazio</p></div>';
            } else {
                lista.innerHTML = carrinho.map((item, i) => `
                    <div class="flex items-center gap-4 bg-gray-800/50 p-3 rounded-2xl animate-fade-in">
                        <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
                        <div class="flex-1">
                            <h4 class="text-sm font-bold">${item.nome}</h4>
                            <p class="text-xs text-[#31d072]">R$ ${item.preco.toFixed(2)}</p>
                        </div>
                        <button onclick="remover(${i})" class="text-gray-600 hover:text-red-500"><i class="fas fa-times"></i></button>
                    </div>
                `).join('');
            }

            let valor = carrinho.reduce((acc, obj) => acc + obj.preco, 0);
            totalEl.innerText = `R$ ${valor.toFixed(2)}`;
            subtotalEl.innerText = `R$ ${valor.toFixed(2)}`;
            mTotal.innerText = `R$ ${valor.toFixed(2)}`;
            mCount.innerText = carrinho.length;
        }

        function remover(i) {
            carrinho.splice(i, 1);
            atualizar();
        }

        function toggleMobileCart() {
            const c = document.getElementById('carrinho');
            c.classList.toggle('hidden');
            c.classList.toggle('flex');
        }

        function setTab(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function finalizar() {
            if(carrinho.length === 0) return alert("Adicione produtos primeiro!");
            alert("Venda enviada com sucesso!");
            carrinho = [];
            atualizar();
        }
    </script>
</body>
</html>
