<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDV PRO | Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: white; --border: rgba(255, 255, 255, 0.1); }
        .light-mode { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; --border: rgba(0, 0, 0, 0.1); }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; padding-top: env(safe-area-inset-top); }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-btn { color: #22c55e; border-bottom: 3px solid #22c55e; }
        .input-pay { background: #020617; border: 2px solid #22c55e; border-radius: 12px; padding: 12px; outline: none; width: 100%; text-align: center; font-weight: 900; color: #22c55e; }
        .logo-area { padding: 25px 0; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="logo-area border-b border-gray-800 flex justify-between items-center px-6 relative z-50">
        <div class="w-10"></div>
        <div class="text-center">
            <h1 class="text-3xl font-black italic tracking-tighter flex items-center justify-center gap-2">
                <i class="fas fa-leaf text-green-500"></i> PDV <span class="text-green-500">PRO</span>
            </h1>
            <p class="text-[8px] text-gray-500 font-bold uppercase tracking-[0.4em]">Inteligência em Vendas</p>
        </div>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full glass flex items-center justify-center shadow-lg">
            <i id="theme-icon" class="fas fa-moon text-yellow-400"></i>
        </button>
    </header>

    <nav class="border-b border-gray-800 flex px-2 bg-black/20">
        <button onclick="mudarAba('vendas', this)" class="aba-btn active-btn py-4 text-[10px] font-black uppercase flex-1">Vendas</button>
        <button onclick="mudarAba('estoque', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Estoque</button>
        <button onclick="mudarAba('balanco', this)" class="aba-btn py-4 text-[10px] font-black uppercase flex-1 text-gray-500">Balanço</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-5 pb-44">
        <div id="vendas" class="tab-content active">
            <div id="vendas-container" class="space-y-8"></div>
        </div>

        <div id="estoque" class="tab-content">
            <div class="glass p-5 rounded-3xl mb-6">
                <h3 class="text-[10px] font-black uppercase text-green-500 mb-4">Gerenciar Categorias</h3>
                <div id="categorias-lista" class="flex flex-wrap gap-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="nova-cat" class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex-1 text-xs" placeholder="Nova Categoria">
                    <button onclick="addCat()" class="bg-green-500 text-black px-4 rounded-xl font-bold">+</button>
                </div>
            </div>
            <div id="estoque-lista" class="space-y-3"></div>
        </div>

        <div id="balanco" class="tab-content">
            <div class="glass p-8 rounded-[2.5rem] border-b-4 border-green-500 text-center mb-6">
                <h3 id="bal-bruto" class="text-4xl font-black italic text-green-500">R$ 0,00</h3>
                <p class="text-gray-500 text-[10px] uppercase font-bold mt-2">Faturamento Total</p>
            </div>
            <div id="caixas-detalhados" class="grid grid-cols-2 gap-3"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-6 rounded-t-[2.5rem] z-50">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[8px] uppercase text-gray-500 font-black">Total Pedido</p>
                <h2 id="total-display" class="text-3xl font-black italic text-white">R$ 0,00</h2>
            </div>
            <button onclick="abrirPagamento()" class="bg-green-500 text-black font-black px-12 py-5 rounded-2xl shadow-xl text-xs uppercase tracking-widest active:scale-95 transition-all">Pagar</button>
        </div>
    </footer>

    <div id="modal-pag" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black mb-6 flex justify-between uppercase italic text-gray-500">
                PAGAMENTO PDV PRO <button onclick="fecharModalPag()">&times;</button>
            </h3>
            
            <div class="bg-gray-900 p-6 rounded-3xl mb-4 text-center border border-slate-800">
                <span class="text-4xl font-black text-[#22c55e]" id="pag-total-devido">R$ 0,00</span>
                <div class="mt-3 flex flex-wrap justify-center gap-2" id="tags-pago"></div>
                <div class="mt-4 flex justify-between text-[10px] font-bold uppercase pt-3 border-t border-slate-800">
                    <span class="text-red-500">Falta: <span id="pag-faltando">R$ 0,00</span></span>
                    <span id="box-troco" class="text-blue-400 hidden">Troco: <span id="pag-troco">R$ 0,00</span></span>
                </div>
            </div>

            <div id="menu-metodos" class="grid grid-cols-2 gap-3">
                <button onclick="setMetodo('Dinheiro')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-money-bill-wave text-green-500"></i><span class="text-[10px]">DINHEIRO</span></button>
                <button onclick="setMetodo('Pix')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-bolt text-teal-400"></i><span class="text-[10px]">PIX</span></button>
                <button onclick="setMetodo('Débito')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-credit-card text-blue-400"></i><span class="text-[10px]">DÉBITO</span></button>
                <button onclick="setMetodo('Crédito')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2"><i class="fas fa-credit-card text-purple-400"></i><span class="text-[10px]">CRÉDITO</span></button>
            </div>

            <div id="area-valor" class="hidden">
                <div class="flex justify-between text-xs mb-4 uppercase font-bold text-gray-500"><span id="metodo-nome"></span> <button onclick="cancelarMetodo()" class="text-red-400">Voltar</button></div>
                <input type="number" id="valor-input" class="input-pay mb-4" placeholder="0.00">
                <button onclick="confirmarValor()" class="w-full bg-green-500 text-black font-black py-4 rounded-xl uppercase text-xs">Confirmar Valor</button>
            </div>

            <button id="btn-concluir" disabled onclick="concluirVenda()" class="hidden w-full bg-green-500 text-black font-black py-5 rounded-2xl mt-4 uppercase text-xs">Concluir Venda</button>
        </div>
    </div>

    <script>
        let categorias = ['Lanches', 'Bebidas'];
        let produtos = [{id:1, n:'Burger Pro', p:25.00, c:'Lanches'}, {id:2, n:'Refrigerante', p:8.00, c:'Bebidas'}];
        let caixa = { Dinheiro: 0, Pix: 0, Débito: 0, Crédito: 0, Total: 0 };
        let totalPedido = 0, pagoAcumulado = 0, pagamentosVenda = [], metodoAtual = "";

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('light-mode') ? "fas fa-sun text-orange-500" : "fas fa-moon text-yellow-400";
        }

        function renderVendas() {
            document.getElementById('vendas-container').innerHTML = categorias.map(cat => `
                <div><h3 class="text-[10px] font-black uppercase text-green-500 mb-4 tracking-widest flex items-center gap-2"><span class="w-1 h-1 bg-green-500 rounded-full"></span> ${cat}</h3>
                <div class="grid grid-cols-2 gap-4">${produtos.filter(p => p.c === cat).map(p => `
                <div onclick="add(${p.id})" class="glass p-5 rounded-2xl active:bg-green-500 transition text-left">
                <h4 class="font-bold text-sm">${p.n}</h4><p class="text-xs text-gray-400">R$ ${p.p.toFixed(2)}</p></div>`).join('')}</div></div>`).join('');
        }

        function renderEstoque() {
            document.getElementById('estoque-lista').innerHTML = produtos.map(p => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div><h4 class="font-bold text-sm text-green-500">${p.n}</h4><p class="text-[9px] text-gray-500 font-black uppercase">${p.c}</p></div>
                    <div class="flex gap-2"><button class="text-blue-400 p-2"><i class="fas fa-edit"></i></button><button class="text-red-500 p-2"><i class="fas fa-trash"></i></button></div>
                </div>`).join('');
            document.getElementById('categorias-lista').innerHTML = categorias.map((c,i) => `<span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-[9px] font-black uppercase">${c} <i class="fas fa-times ml-1 text-red-500" onclick="remCat(${i})"></i></span>`).join('');
        }

        function add(id) {
            totalPedido += produtos.find(x => x.id === id).p;
            document.getElementById('total-display').innerText = `R$ ${totalPedido.toFixed(2)}`;
        }

        function abrirPagamento() {
            if(totalPedido === 0) return alert("Selecione itens!");
            pagoAcumulado = 0; pagamentosVenda = [];
            document.getElementById('pag-total-devido').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('pag-faltando').innerText = `R$ ${totalPedido.toFixed(2)}`;
            document.getElementById('modal-pag').classList.remove('hidden');
            document.getElementById('menu-metodos').classList.remove('hidden');
            document.getElementById('area-valor').classList.add('hidden');
            document.getElementById('btn-concluir').classList.add('hidden');
            document.getElementById('tags-pago').innerHTML = "";
        }

        function setMetodo(m) {
            metodoAtual = m;
            document.getElementById('menu-metodos').classList.add('hidden');
            document.getElementById('area-valor').classList.remove('hidden');
            document.getElementById('metodo-nome').innerText = m;
            document.getElementById('valor-input').value = (totalPedido - pagoAcumulado).toFixed(2);
        }

        function confirmarValor() {
            const v = parseFloat(document.getElementById('valor-input').value) || 0;
            pagoAcumulado += v;
            pagamentosVenda.push({m: metodoAtual, v: v});
            document.getElementById('tags-pago').innerHTML = pagamentosVenda.map(p => `<span class="bg-green-500 text-black text-[9px] px-2 py-1 rounded font-bold">${p.m}: R$ ${p.v.toFixed(2)}</span>`).join('');
            
            const falta = totalPedido - pagoAcumulado;
            document.getElementById('pag-faltando').innerText = `R$ ${Math.max(0, falta).toFixed(2)}`;
            
            if(falta <= 0) {
                document.getElementById('area-valor').classList.add('hidden');
                document.getElementById('btn-concluir').classList.remove('hidden');
                document.getElementById('btn-concluir').disabled = false;
                if(pagoAcumulado > totalPedido && metodoAtual === 'Dinheiro') {
                    document.getElementById('box-troco').classList.remove('hidden');
                    document.getElementById('pag-troco').innerText = `R$ ${(pagoAcumulado - totalPedido).toFixed(2)}`;
                }
            } else { cancelarMetodo(); }
        }

        function concluirVenda() {
            pagamentosVenda.forEach(p => caixa[p.m] += p.v);
            caixa.Total += totalPedido;
            alert("PDV PRO: Venda Concluída!");
            totalPedido = 0;
            document.getElementById('total-display').innerText = `R$ 0,00`;
            fecharModalPag();
            atualizarBalanco();
            mudarAba('balanco', document.querySelectorAll('.aba-btn')[2]);
        }

        function atualizarBalanco() {
            document.getElementById('bal-bruto').innerText = `R$ ${caixa.Total.toFixed(2)}`;
            document.getElementById('caixas-detalhados').innerHTML = ['Dinheiro', 'Pix', 'Débito', 'Crédito'].map(m => `
                <div class="glass p-4 rounded-2xl"><p class="text-[8px] uppercase text-gray-500 font-bold">${m}</p><h4 class="font-black">R$ ${caixa[m].toFixed(2)}</h4></div>
            `).join('');
        }

        function remCat(i) { categorias.splice(i,1); renderEstoque(); renderVendas(); }
        function addCat() { const n = document.getElementById('nova-cat').value; if(n) { categorias.push(n); document.getElementById('nova-cat').value=''; renderEstoque(); renderVendas(); } }
        function fecharModalPag() { document.getElementById('modal-pag').classList.add('hidden'); }
        function cancelarMetodo() { document.getElementById('area-valor').classList.add('hidden'); document.getElementById('menu-metodos').classList.remove('hidden'); }
        function mudarAba(id, btn) { document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.querySelectorAll('.aba-btn').forEach(b => {b.classList.remove('active-btn'); b.classList.add('text-gray-500');}); document.getElementById(id).classList.add('active'); btn.classList.add('active-btn'); }

        renderVendas(); renderEstoque(); atualizarBalanco();
    </script>
</body>
    </html>
