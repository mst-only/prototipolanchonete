<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-[#EEF2FF] p-6 rounded-[24px]">
            <h2 class="text-[#1E293B] text-xl font-bold mb-6">Resumo do Pedido</h2>
            <div class="flex justify-between items-center">
                <span class="text-[#64748B]">Itens Selecionados</span>
                <span class="text-[#1E293B] text-xl font-bold">R$ 150,00</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[24px] shadow-sm border border-[#F1F5F9]">
            <h2 class="text-[#1E293B] text-xl font-bold mb-6">Finalizar Venda</h2>

            <div id="lista-pagamentos" class="space-y-3 mb-4">
                </div>

            <div class="mb-6">
                <p class="text-[14px] font-bold text-[#64748B] mb-2">Adicionar Pagamento:</p>
                <div class="relative">
                    <select id="select-metodo" 
                            onchange="adicionarLinhaPagamento(this.value)"
                            class="w-full p-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-[16px] appearance-none font-semibold text-[#1E293B] focus:outline-none cursor-pointer">
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Pix">Pix</option>
                        <option value="Débito">Cartão de Débito</option>
                        <option value="Crédito">Cartão de Crédito</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#64748B]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                </div>
            </div>

            <button id="btn-confirmar" 
                    disabled
                    class="w-full py-5 bg-[#C7D2FE] text-[#6366F1] font-bold rounded-[20px] transition-all uppercase tracking-widest text-[15px]">
                CONFIRMAR E EMITIR
            </button>
        </div>
    </div>

    <script>
        let totalVenda = 150.00;
        let pagamentos = [];

        function adicionarLinhaPagamento(metodo) {
            if (!metodo) return;
            const id = Date.now();
            const container = document.getElementById('lista-pagamentos');

            const div = document.createElement('div');
            div.id = `pg-${id}`;
            div.className = "flex items-center gap-3 p-4 bg-[#F8FAFC] rounded-[16px] border border-[#E2E8F0]";
            div.innerHTML = `
                <div class="flex-1 font-bold text-[#475569]">${metodo}</div>
                <div class="w-28 flex items-center bg-white border border-[#E2E8F0] rounded-[12px] px-3">
                    <span class="text-[#94A3B8] text-sm font-bold">R$</span>
                    <input type="number" step="0.01" placeholder="0,00"
                           class="w-full p-2 outline-none font-bold text-[#1E293B]"
                           oninput="atualizarValorPg(${id}, this.value)">
                </div>
                <button onclick="removerPg(${id})" class="text-[#94A3B8] hover:text-red-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            `;

            container.appendChild(div);
            pagamentos.push({ id, metodo, valor: 0 });
            document.getElementById('select-metodo').value = ""; // Limpa o menu
            checarStatus();
        }

        function atualizarValorPg(id, val) {
            const p = pagamentos.find(x => x.id === id);
            if (p) p.valor = parseFloat(val) || 0;
            checarStatus();
        }

        function removerPg(id) {
            pagamentos = pagamentos.filter(x => x.id !== id);
            document.getElementById(`pg-${id}`).remove();
            checarStatus();
        }

        function checarStatus() {
            const totalPago = pagamentos.reduce((acc, curr) => acc + curr.value, 0);
            const btn = document.getElementById('btn-confirmar');

            if (totalPago >= totalVenda) {
                btn.disabled = false;
                btn.className = "w-full py-5 bg-[#6366F1] text-white font-bold rounded-[20px] transition-all uppercase tracking-widest text-[15px] shadow-lg shadow-indigo-100";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-5 bg-[#C7D2FE] text-[#6366F1] font-bold rounded-[20px] transition-all uppercase tracking-widest text-[15px]";
            }
        }
    </script>

</body>
</html>
